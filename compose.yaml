services:
  soc:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_PROVIDER: offline
      SOC_DB_PATH: /app/data/soc.db
    volumes:
      - soc-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  soc-data:
